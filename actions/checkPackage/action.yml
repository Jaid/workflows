name: Check Bun package
description: Install the caller’s locked dependencies, lint and run its package scripts.
inputs:
  bunVersion:
    description: Bun version override
    default: ''
  lint:
    description: run the lint script or local ESLint
    default: 'true'
  scripts:
    description: package scripts in execution order, one per line
    default: test
  ref:
    description: caller ref (defaults to the event commit)
    default: ''
  artifactId:
    description: immutable ID of a build directory artifact to restore before checking the package
  distDirectory:
    description: build output directory in the caller’s checkout
    default: dist
  releaseTag:
    description: if set, pack and verify this tagged version after the checks
    default: ''
  packageDirectory:
    description: directory containing the package to pack
    default: .
outputs:
  sourceSha:
    description: exact commit checked out for this job
    value: ${{ steps.source.outputs.commit }}
  artifact:
    description: artifact name for the packed release tarball
    value: ${{ steps.pack.outputs.artifact }}
runs:
  using: composite
  steps:
    - id: source
      uses: actions/checkout@v7.0.1
      with:
        ref: ${{ inputs.ref }}
        persist-credentials: false
    - uses: oven-sh/setup-bun@v2.2.0
      with:
        bun-version: ${{ inputs.bunVersion }}
        no-cache: ${{ inputs.releaseTag != '' }}
    - shell: bash
      run: |
        bun install --frozen-lockfile
        printf 'WORKFLOWS_PATH=%s\n' "$GITHUB_ACTION_PATH/../.." >> "$GITHUB_ENV"
    - id: restore
      if: inputs.artifactId != ''
      shell: bash
      env:
        ARTIFACT_ID: ${{ inputs.artifactId }}
        DIST_DIRECTORY: ${{ inputs.distDirectory }}
      run: bun "$WORKFLOWS_PATH/src/buildArtifact.ts" restore
    - if: inputs.artifactId != ''
      uses: actions/download-artifact@v8.0.2
      with:
        artifact-ids: ${{ inputs.artifactId }}
        path: ${{ steps.restore.outputs.directory }}
        merge-multiple: true
    - shell: bash
      env:
        RUN_LINT: ${{ inputs.lint }}
        PACKAGE_SCRIPTS: ${{ inputs.scripts }}
      run: bun "$GITHUB_ACTION_PATH/check.ts"
    - id: pack
      if: inputs.releaseTag != ''
      shell: bash
      env:
        RELEASE_TAG: ${{ inputs.releaseTag }}
        PACKAGE_DIRECTORY: ${{ inputs.packageDirectory }}
      run: bun "$GITHUB_ACTION_PATH/pack.ts"
