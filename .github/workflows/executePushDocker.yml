name: executePushDocker
on:
  workflow_call:
    inputs:
      passedInputs:
        type: string
        required: true
        description: pushDocker inputs as JSON
      matrixEntry:
        type: string
        required: true
        description: one entry from makeDockerTagMatrix as JSON
      nameSuffix:
        type: string
    secrets:
      dockerHubToken:
        required: false
    outputs:
      artifactId:
        value: ${{ jobs.build.outputs.artifactId }}
      imageFile:
        value: ${{ jobs.build.outputs.imageFile }}
      meta:
        value: ${{ jobs.upload.outputs.meta }}
      digest:
        value: ${{ jobs.upload.outputs.digest }}
      imageId:
        value: ${{ jobs.upload.outputs.imageId }}
      imageName:
        value: ${{ jobs.upload.outputs.imageName }}
      imageSlug:
        value: ${{ jobs.upload.outputs.imageSlug }}
      imageUser:
        value: ${{ jobs.upload.outputs.imageUser }}
jobs:
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/buildDocker.yml
    with:
      id: ${{ fromJSON(inputs.matrixEntry).id }}
      arch: ${{ fromJSON(inputs.matrixEntry).platform || 'linux/amd64' }}
      buildContext: ${{ fromJSON(inputs.passedInputs).buildContext || 'src' }}
      buildArgs: |-
        ${{ fromJSON(inputs.passedInputs).buildArgs }}
        ${{ fromJSON(inputs.matrixEntry).buildArgs }}
      imageName: ${{ fromJSON(inputs.passedInputs).imageName }}
      releaseOptions: ${{ inputs.passedInputs }}
      flavorSuffix: ${{ fromJSON(inputs.matrixEntry).flavor }}
      nameSuffix: ${{ inputs.nameSuffix }}
  test:
    needs: build
    permissions:
      contents: read
    uses: ./.github/workflows/testDocker.yml
    with:
      arch: ${{ fromJSON(inputs.matrixEntry).platform || 'linux/amd64' }}
      id: ${{ fromJSON(inputs.matrixEntry).id }}
      dockerRunArgs: ${{ fromJSON(inputs.passedInputs).testDockerRunArgs }}
      appArgs: ${{ fromJSON(inputs.passedInputs).testAppArgs }}
      testEval: ${{ fromJSON(inputs.passedInputs).testEval }}
      imageArtifact: ${{ needs.build.outputs.imageArtifact }}
      artifactId: ${{ needs.build.outputs.artifactId }}
      imageFile: ${{ needs.build.outputs.imageFile }}
      imageIdentifier: ${{ needs.build.outputs.imageIdentifier }}
      nameSuffix: ${{ inputs.nameSuffix }}
  upload:
    # Inherit the caller's registry grant; build-only callers can grant just contents: read.
    needs: [build, test]
    if: toJSON(fromJSON(inputs.passedInputs).publish) != 'false' && !startsWith(github.event_name, 'pull_request')
    uses: ./.github/workflows/uploadDocker.yml
    with:
      id: ${{ fromJSON(inputs.matrixEntry).id }}
      arch: ${{ fromJSON(inputs.matrixEntry).platform || 'linux/amd64' }}
      dockerHubUser: ${{ fromJSON(inputs.passedInputs).dockerHubUser }}
      dockerHubRegistry: ${{ fromJSON(inputs.passedInputs).dockerHubRegistry || 'docker.io' }}
      githubRegistry: ${{ fromJSON(inputs.passedInputs).githubRegistry || 'ghcr.io' }}
      readmePath: ${{ fromJSON(inputs.passedInputs).readmePath }}
      buildOutput: ${{ toJSON(needs.build.outputs) }}
      useBuildTags: true
      nameSuffix: ${{ inputs.nameSuffix }}
    secrets:
      dockerHubToken: ${{ secrets.dockerHubToken }}
