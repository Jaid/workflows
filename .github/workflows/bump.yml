name: bump
on:
  workflow_call:
    inputs:
      bumpAmount:
        type: string
        default: patch
        description: major, minor, patch or none
      releaseBranch:
        type: string
        default: main
      releaseTitle:
        type: string
        default: |-
          {{#if oldTag}}{{repo.slug}} {{newTag}}{{else}}[Initial release] {{repo.slug}} {{newTag}}{{/if}}
      releaseBody:
        type: string
        default: |-
          {{#if oldTag}}[{{oldTag}}]({{repo.url}}/tree/{{oldTag}}) [→]({{repo.url}}/compare/{{oldTag}}...{{newTag}}) [{{newTag}}]({{repo.url}}/tree/{{newTag}}){{else}}[{{newTag}}]({{repo.url}}/tree/{{newTag}}){{/if}}
      makeLatest:
        type: string
        default: 'true'
        description: 'GitHub release latest setting: true, false or legacy'
      updateFiles:
        type: boolean
        description: commit the root package.json version before tagging, if it has a version field
    outputs:
      oldTag:
        value: ${{ jobs.release.outputs.oldTag }}
      newTag:
        value: ${{ jobs.release.outputs.newTag }}
      newSemver:
        value: ${{ jobs.release.outputs.newSemver }}
      releaseId:
        value: ${{ jobs.release.outputs.releaseId }}
      releaseUrl:
        value: ${{ jobs.release.outputs.releaseUrl }}
      releaseTitle:
        value: ${{ jobs.release.outputs.releaseTitle }}
      releaseBody:
        value: ${{ jobs.release.outputs.releaseBody }}
jobs:
  release:
    if: github.ref == format('refs/heads/{0}', inputs.releaseBranch) && contains(fromJSON('["workflow_dispatch","repository_dispatch","push","schedule"]'), github.event_name)
    runs-on: ubuntu-latest
    concurrency:
      group: bump-${{ inputs.releaseBranch }}
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      oldTag: ${{ steps.tag.outputs.oldTag }}
      newTag: ${{ steps.tag.outputs.newTag }}
      newSemver: ${{ steps.tag.outputs.newSemver }}
      releaseId: ${{ steps.release.outputs.id }}
      releaseUrl: ${{ steps.release.outputs.html_url }}
      releaseTitle: ${{ steps.tag.outputs.releaseTitle }}
      releaseBody: ${{ steps.tag.outputs.releaseBody }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: $/
        with:
          releaseDependencies: 'true'
      - id: tag
        working-directory: ${{ env.WORKFLOWS_PATH }}
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_INPUTS: ${{ toJSON(inputs) }}
        run: |
          gh auth setup-git --hostname github.com
          bun src/release.ts "$GITHUB_WORKSPACE"
      - id: release
        if: steps.tag.outputs.newTag != ''
        uses: ncipollo/release-action@v1.21.0
        with:
          allowUpdates: true
          name: ${{ steps.tag.outputs.releaseTitle }}
          body: ${{ steps.tag.outputs.releaseBody }}
          tag: ${{ steps.tag.outputs.newTag }}
          makeLatest: ${{ inputs.makeLatest }}
      - name: Dispatch bumped
        if: steps.tag.outputs.newTag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD: ${{ steps.tag.outputs.payload }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
          RELEASE_URL: ${{ steps.release.outputs.html_url }}
        run: |
          jq -cn --argjson data "$PAYLOAD" --arg id "$RELEASE_ID" --arg url "$RELEASE_URL" '{event_type:"bumped", client_payload:($data + {releaseId:$id, releaseUrl:$url})}' |
            gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" --input -
          printf 'Released <%s>\n' "$RELEASE_URL" >> "$GITHUB_STEP_SUMMARY"
