name: debug
on:
  workflow_call: {}
jobs:
  debug:
    runs-on: ubuntu-26.04-arm
    permissions: {}
    steps:
      - name: Run and runner
        run: |
          {
            printf '### %s · %s\n\n' "$GITHUB_REPOSITORY" "$GITHUB_EVENT_NAME"
            printf -- '- Ref: %s at %s\n' "$GITHUB_REF" "$GITHUB_SHA"
            printf -- '- Workflow: %s (attempt %s)\n' "$GITHUB_WORKFLOW_REF" "$GITHUB_RUN_ATTEMPT"
            printf -- '- Runner: %s / %s\n' "$RUNNER_OS" "$RUNNER_ARCH"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Toolchain and disk space
        run: |
          uname -a
          git --version
          node --version
          docker --version
          docker buildx version
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
