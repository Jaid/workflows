name: testDocker
on:
  workflow_call:
    inputs:
      dockerRunArgs:
        type: string
      appArgs:
        type: string
      testEval:
        type: string
        description: JavaScript assertion over status, stdout, stderr, result, inputs and fs
        default: status === 0
      test:
        type: string
        description: alias for testEval used by older callers
      imageFolder:
        type: string
      imageFile:
        type: string
        default: image.tar
      imageArtifact:
        type: string
      artifactId:
        description: immutable image artifact ID from buildDocker (takes precedence over its name)
        type: string
      imageIdentifier:
        type: string
      nameSuffix:
        type: string
      arch:
        type: string
        default: linux/amd64
      id:
        type: string
      buildContext:
        description: caller directory to build when testing without a prebuilt artifact
        type: string
        default: src
permissions:
  contents: read
jobs:
  build:
    if: inputs.artifactId == '' && inputs.imageArtifact == '' && inputs.imageIdentifier == ''
    uses: ./.github/workflows/buildDocker.yml
    with:
      arch: ${{ inputs.arch }}
      buildContext: ${{ inputs.buildContext }}
      imageFile: ${{ inputs.imageFile }}
      id: ${{ inputs.id }}
      nameSuffix: ${{ inputs.nameSuffix }}
  test:
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'skipped' || needs.build.result == 'success') }}
    name: test${{ inputs.nameSuffix }}
    runs-on: ${{ (inputs.arch == 'linux/arm64' || inputs.arch == 'linux/arm64/v8') && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: $/
      - id: archive
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ inputs.artifactId || needs.build.outputs.artifactId }}
          name: ${{ !inputs.artifactId && !needs.build.outputs.artifactId && (inputs.imageArtifact || format('{0}_{1}', github.run_id, inputs.id || 'default')) || '' }}
          path: ${{ inputs.imageFolder || format('{0}/image', runner.temp) }}
          merge-multiple: true
      - id: load
        env:
          ARCHIVE: ${{ steps.archive.outputs.download-path }}/${{ inputs.imageFile }}
          IMAGE_IDENTIFIER: ${{ inputs.imageIdentifier || needs.build.outputs.imageIdentifier }}
        run: |
          loaded=$(docker load --input "$ARCHIVE")
          echo "$loaded"
          image=${IMAGE_IDENTIFIER:-${loaded##*Loaded image: }}
          docker image inspect "$image" > /dev/null
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - if: inputs.arch != 'linux/amd64' && inputs.arch != 'linux/arm64' && inputs.arch != 'linux/arm64/v8'
        uses: docker/setup-qemu-action@v4.4.0
      - name: Run and check the image
        env:
          WORKFLOW_INPUTS: ${{ toJSON(inputs) }}
          IMAGE_IDENTIFIER: ${{ steps.load.outputs.image }}
        run: bun "$WORKFLOWS_PATH/src/docker/testImage.ts"
