name: uploadDocker
on:
  workflow_call:
    inputs:
      arch:
        type: string
        default: linux/amd64
      dockerHubUser:
        type: string
      dockerHubRegistry:
        type: string
        default: docker.io
      githubRegistry:
        type: string
        default: ghcr.io
      baseTags:
        type: string
        default: type=ref,event=branch
      addShaTags:
        type: boolean
      addScheduleTags:
        type: boolean
      addVersionTag:
        type: boolean
      versionTagPrefix:
        type: string
      additionalTags:
        type: string
      versionTag:
        type: string
      versionTagSemverPrefix:
        type: string
      flavorLatest:
        type: string
        default: auto
      flavorPrefix:
        type: string
      flavorSuffix:
        type: string
      flavorConnectionString:
        type: string
        default: '-'
      nameSuffix:
        type: string
      imageSlug:
        type: string
      id:
        type: string
      buildOutput:
        type: string
        required: true
        description: buildDocker job outputs as JSON
      useBuildTags:
        type: boolean
        description: use the exact tags resolved at build time
      title:
        type: string
        description: image titles are baked in at build time via buildDocker.releaseOptions
      readmePath:
        type: string
    secrets:
      dockerHubToken:
        required: false
    outputs:
      meta:
        value: ${{ jobs.upload.outputs.meta }}
      digest:
        value: ${{ jobs.upload.outputs.digest }}
      imageId:
        value: ${{ jobs.upload.outputs.imageId }}
      imageName:
        value: ${{ jobs.upload.outputs.imageName }}
      imageSlug:
        value: ${{ jobs.upload.outputs.imageSlug }}
      imageUser:
        value: ${{ jobs.upload.outputs.imageUser }}
jobs:
  upload:
    if: ${{ !startsWith(github.event_name, 'pull_request') }}
    name: upload${{ inputs.nameSuffix }}
    # Copying a Docker archive needs no emulation, even for ARM images.
    runs-on: ubuntu-26.04
    env:
      HUB_ENABLED: ${{ secrets.dockerHubToken != '' }}
    outputs:
      meta: ${{ steps.publish.outputs.meta }}
      digest: ${{ steps.publish.outputs.digest }}
      imageId: ${{ steps.publish.outputs.imageId }}
      imageName: ${{ steps.registry.outputs.imageName }}
      imageSlug: ${{ steps.registry.outputs.imageSlug }}
      imageUser: ${{ steps.registry.outputs.imageUser }}
    steps:
      - uses: $/
      - id: registry
        env:
          WORKFLOW_INPUTS: ${{ toJSON(inputs) }}
          IMAGE_NAME: ${{ fromJSON(inputs.buildOutput).imageName }}
        run: bun "$WORKFLOWS_PATH/src/docker/registry.ts"
      - id: metadata
        if: ${{ !inputs.useBuildTags }}
        uses: $/actions/dockerMetadata
        with:
          options: ${{ toJSON(inputs) }}
          imageName: ${{ steps.registry.outputs.imageName }}
          id: ${{ inputs.id }}
      - id: archive
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ fromJSON(inputs.buildOutput).artifactId }}
          name: ${{ !fromJSON(inputs.buildOutput).artifactId && fromJSON(inputs.buildOutput).imageArtifact || '' }}
          path: ${{ runner.temp }}/image
          merge-multiple: true
      - uses: docker/login-action@v4.8.0
        with:
          registry: ${{ inputs.githubRegistry }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - if: env.HUB_ENABLED == 'true'
        uses: docker/login-action@v4.8.0
        with:
          registry: ${{ inputs.dockerHubRegistry }}
          username: ${{ steps.registry.outputs.imageUser }}
          password: ${{ secrets.dockerHubToken }}
      - id: publish
        env:
          IMAGES: ${{ steps.registry.outputs.images }}
          IMAGE_PATH: ${{ steps.archive.outputs.download-path }}/${{ fromJSON(inputs.buildOutput).imageFile }}
          TAG_NAMES: ${{ inputs.useBuildTags && fromJSON(inputs.buildOutput).tagNames || steps.metadata.outputs.tagNames }}
          BUILD_META: ${{ fromJSON(inputs.buildOutput).meta }}
        run: bun "$WORKFLOWS_PATH/src/docker/publish.ts"
      - if: env.HUB_ENABLED == 'true' && inputs.dockerHubRegistry == 'docker.io' && inputs.readmePath != ''
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - if: env.HUB_ENABLED == 'true' && inputs.dockerHubRegistry == 'docker.io' && inputs.readmePath != '' && hashFiles(inputs.readmePath) != ''
        uses: peter-evans/dockerhub-description@v5.0.0
        with:
          username: ${{ steps.registry.outputs.imageUser }}
          password: ${{ secrets.dockerHubToken }}
          repository: ${{ steps.registry.outputs.hubRepository }}
          readme-filepath: ${{ inputs.readmePath }}
