name: pushDocker
on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: true
        description: publish each tested image (pull requests always build and test only)
      buildContext:
        type: string
        default: src
      buildArgs:
        type: string
        description: build arguments, one KEY=value per line
      imageName:
        type: string
        description: defaults to the lowercase repository name without its docker- prefix
      arch:
        type: string
        description: alias for matrixPlatform
      matrixPlatform:
        type: string
        description: platforms separated by whitespace, commas or semicolons (defaults to linux/amd64)
      matrixBases:
        type: string
        description: base images separated by whitespace, commas or semicolons
      matrixAdditionEvals:
        type: string
        description: 'additional build arguments, one key: JavaScript expression per line'
      matrixFlavorEval:
        type: string
        description: JavaScript expression returning the tag suffix and unique matrix ID
      testEval:
        type: string
        default: status === 0
      testDockerRunArgs:
        type: string
      testAppArgs:
        type: string
      githubRegistry:
        type: string
        default: ghcr.io
      dockerHubRegistry:
        type: string
        default: docker.io
      dockerHubUser:
        type: string
        description: defaults to the lowercase GitHub owner
      readmePath:
        type: string
        description: caller README to upload to Docker Hub
      baseTags:
        type: string
        default: type=ref,event=branch
      additionalTags:
        type: string
        description: additional docker/metadata-action rules, one per line
      addShaTags:
        type: boolean
      addScheduleTags:
        type: boolean
      addVersionTag:
        type: boolean
      versionTagPrefix:
        type: string
        description: prefix for the generated SemVer tag
      versionTag:
        type: string
        description: explicit version to tag (e.g. the newTag from a bumped dispatch)
      versionTagSemverPrefix:
        type: string
      flavorLatest:
        type: string
        default: auto
      flavorPrefix:
        type: string
      flavorSuffix:
        type: string
      flavorConnectionString:
        type: string
        default: '-'
    secrets:
      dockerHubToken:
        description: Docker Hub token with write access
        required: false
    outputs:
      artifactId:
        value: ${{ jobs.invoke.outputs.artifactId }}
      imageFile:
        value: ${{ jobs.invoke.outputs.imageFile }}
      meta:
        value: ${{ jobs.invoke.outputs.meta }}
      digest:
        value: ${{ jobs.invoke.outputs.digest }}
      imageId:
        value: ${{ jobs.invoke.outputs.imageId }}
      imageName:
        value: ${{ jobs.invoke.outputs.imageName }}
      imageSlug:
        value: ${{ jobs.invoke.outputs.imageSlug }}
      imageUser:
        value: ${{ jobs.invoke.outputs.imageUser }}
jobs:
  makeMatrix:
    permissions:
      contents: read
    uses: ./.github/workflows/makeDockerTagMatrix.yml
    with:
      bases: ${{ inputs.matrixBases }}
      platform: ${{ inputs.matrixPlatform || inputs.arch }}
      additionEvals: ${{ inputs.matrixAdditionEvals }}
      flavorEval: ${{ inputs.matrixFlavorEval }}
  invoke:
    needs: makeMatrix
    name: invoke${{ matrix.id != 'default' && format(' ({0})', matrix.id) || '' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.makeMatrix.outputs.output) }}
    uses: ./.github/workflows/executePushDocker.yml
    with:
      passedInputs: ${{ toJSON(inputs) }}
      matrixEntry: ${{ toJSON(matrix) }}
      nameSuffix: ${{ matrix.id != 'default' && format(' ({0})', matrix.id) || '' }}
    secrets:
      dockerHubToken: ${{ secrets.dockerHubToken }}
