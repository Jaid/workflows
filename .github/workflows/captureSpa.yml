name: captureSpa
on:
  workflow_call:
    inputs:
      buildArtifact:
        type: string
        default: build
        description: name of the static site artifact from this run
      artifactId:
        type: string
        description: immutable build artifact ID (takes precedence over buildArtifact)
      siteDirectory:
        type: string
        default: .
        description: directory containing index.html inside the artifact
      basePath:
        type: string
        default: /
        description: URL prefix the app was built for
      route:
        type: string
        default: /
        description: app route relative to basePath, including query and fragment
      imageName:
        type: string
        default: screenshot
        description: output filename stem, unique per capture in a workflow run
      captureOptions:
        type: string
        default: '{}'
        description: JSON screenshot options for capture-page, including viewport and readiness
      storageBranch:
        type: string
        description: branch in the caller’s repository for public inline previews on pushes and manual runs
      webhook:
        type: string
        description: HTTP(S) endpoint to POST the screenshot to as a multipart file
    secrets:
      webhook:
        description: optional private webhook URL, taking precedence over the webhook input
    outputs:
      artifactId:
        value: ${{ jobs.capture.outputs.artifactId }}
      artifactUrl:
        value: ${{ jobs.capture.outputs.artifactUrl }}
      imageFile:
        value: ${{ jobs.capture.outputs.imageFile }}
      previewUrl:
        value: ${{ jobs.preview.outputs.previewUrl }}
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      artifactId: ${{ steps.upload.outputs.artifact-id }}
      artifactUrl: ${{ steps.upload.outputs.artifact-url }}
      imageFile: ${{ steps.snap.outputs.imageFile }}
      hasWebhook: ${{ secrets.webhook != '' || inputs.webhook != '' }}
    steps:
      - uses: $/
      - name: Install capture-page
        env:
          ARTIFACT_ID: ${{ inputs.artifactId }}
        run: |
          if [[ -n $ARTIFACT_ID && ! $ARTIFACT_ID =~ ^[0-9]+$ ]]; then echo 'Expected one numeric build artifact ID.' >&2; exit 1; fi
          bun install --cwd "$WORKFLOWS_PATH" --filter @jaid/workflows-spa --frozen-lockfile --production --ignore-scripts
      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ inputs.artifactId }}
          name: ${{ !inputs.artifactId && (inputs.buildArtifact || 'build') || '' }}
          path: ${{ runner.temp }}/spa-build
          merge-multiple: true
      - name: Capture the built site
        id: snap
        env:
          SITE_DIRECTORY: ${{ inputs.siteDirectory }}
          BASE_PATH: ${{ inputs.basePath }}
          ROUTE: ${{ inputs.route }}
          IMAGE_NAME: ${{ inputs.imageName }}
          CAPTURE_OPTIONS: ${{ inputs.captureOptions }}
        run: bun "$WORKFLOWS_PATH/src/spa/capture.ts" "$RUNNER_TEMP/spa-build" "$RUNNER_TEMP/screenshots"
      - id: upload
        uses: actions/upload-artifact@v7.0.2
        with:
          path: ${{ runner.temp }}/screenshots/${{ steps.snap.outputs.imageFile }}
          archive: false
          if-no-files-found: error
      - name: Add the screenshot to the run summary
        env:
          IMAGE_FILE: ${{ steps.snap.outputs.imageFile }}
          IMAGE_URL: ${{ steps.upload.outputs.artifact-url }}
        run: printf '### SPA screenshot\n\n[Open %s](%s)\n' "$IMAGE_FILE" "$IMAGE_URL" >> "$GITHUB_STEP_SUMMARY"
  preview:
    needs: capture
    if: inputs.storageBranch != '' && github.event.repository.visibility == 'public' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Inherit contents: write only when the caller opts into publication. The browser job is always read-only.
    outputs:
      previewUrl: ${{ steps.publish.outputs.previewUrl }}
    steps:
      - uses: $/
      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.capture.outputs.artifactId }}
          path: ${{ runner.temp }}/preview
          merge-multiple: true
          skip-decompress: true
      - id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_FILE: ${{ needs.capture.outputs.imageFile }}
          STORAGE_BRANCH: ${{ inputs.storageBranch }}
        run: |
          gh auth setup-git --hostname github.com
          bun "$WORKFLOWS_PATH/src/spa/preview.ts" "$RUNNER_TEMP/preview/$IMAGE_FILE"
      - name: Embed the public preview in the run summary
        env:
          IMAGE_URL: ${{ steps.publish.outputs.previewUrl }}
          IMAGE_FILE: ${{ needs.capture.outputs.imageFile }}
        run: printf '### SPA preview\n\n![%s](%s)\n' "$IMAGE_FILE" "$IMAGE_URL" >> "$GITHUB_STEP_SUMMARY"
  webhook:
    needs: capture
    if: needs.capture.outputs.hasWebhook == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: $/
      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.capture.outputs.artifactId }}
          path: ${{ runner.temp }}/webhook
          merge-multiple: true
          skip-decompress: true
      - name: POST the screenshot
        env:
          WEBHOOK: ${{ secrets.webhook || inputs.webhook }}
          IMAGE_FILE: ${{ needs.capture.outputs.imageFile }}
        run: bun "$WORKFLOWS_PATH/src/spa/webhook.ts" "$RUNNER_TEMP/webhook/$IMAGE_FILE"
