name: makeDockerTagMatrix
on:
  workflow_call:
    inputs:
      bases:
        description: base images separated by whitespace, commas or semicolons
        type: string
      platform:
        description: platforms separated by whitespace, commas or semicolons
        type: string
      additionEvals:
        description: 'additional build arguments, one key: JavaScript expression per line'
        type: string
      flavorEval:
        description: JavaScript expression returning the tag suffix and unique matrix ID
        type: string
    outputs:
      output:
        description: JSON array for strategy.matrix.include
        value: ${{ jobs.matrix.outputs.output }}
      nativeArch:
        description: entries native to the matrix generator’s runner
        value: ${{ jobs.matrix.outputs.nativeArch }}
jobs:
  matrix:
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
    outputs:
      output: ${{ steps.matrix.outputs.output }}
      nativeArch: ${{ steps.matrix.outputs.nativeArch }}
    steps:
      - uses: $/
      - id: matrix
        run: bun "$WORKFLOWS_PATH/src/docker/matrix.ts"
        env:
          WORKFLOW_INPUTS: ${{ toJSON(inputs) }}
