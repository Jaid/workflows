name: buildDocker
on:
  workflow_call:
    inputs:
      arch:
        type: string
        default: linux/amd64
      buildContext:
        type: string
        default: src
      buildArgs:
        type: string
      imageFolder:
        type: string
      imageFile:
        type: string
      imageArtifact:
        type: string
      cacheTo:
        type: string
      cacheFrom:
        type: string
      cacheKey:
        type: string
      imageName:
        type: string
      nameSuffix:
        type: string
      tag:
        type: string
        default: ci
      id:
        type: string
      releaseOptions:
        description: JSON tag and label options from pushDocker
        type: string
        default: '{}'
      flavorSuffix:
        type: string
    outputs:
      inputs:
        value: ${{ jobs.build.outputs.inputs }}
      meta:
        value: ${{ jobs.build.outputs.meta }}
      imageFile:
        value: ${{ jobs.build.outputs.imageFile }}
      imageFolder:
        value: ${{ jobs.build.outputs.imageFolder }}
      imageArtifact:
        value: ${{ jobs.build.outputs.imageArtifact }}
      artifactId:
        value: ${{ jobs.build.outputs.artifactId }}
      imagePath:
        value: ${{ jobs.build.outputs.imagePath }}
      cacheHint:
        value: ${{ jobs.build.outputs.cacheHint }}
      imageName:
        value: ${{ jobs.build.outputs.imageName }}
      imageIdentifier:
        value: ${{ jobs.build.outputs.imageIdentifier }}
      context:
        value: ${{ jobs.build.outputs.context }}
      buildArgs:
        value: ${{ jobs.build.outputs.buildArgs }}
      tagNames:
        value: ${{ jobs.build.outputs.tagNames }}
jobs:
  build:
    name: build${{ inputs.nameSuffix }}
    runs-on: ${{ (inputs.arch == 'linux/arm64' || inputs.arch == 'linux/arm64/v8') && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    permissions:
      contents: read
    outputs:
      inputs: ${{ steps.config.outputs.value }}
      meta: ${{ steps.build.outputs.metadata }}
      imagePath: ${{ steps.config.outputs.imagePath }}
      imageFile: ${{ steps.config.outputs.imageFile }}
      imageFolder: ${{ steps.config.outputs.imageFolder }}
      imageArtifact: ${{ steps.config.outputs.imageArtifact }}
      artifactId: ${{ steps.artifact.outputs.artifact-id }}
      cacheHint: ${{ steps.config.outputs.cacheHint }}
      imageName: ${{ steps.config.outputs.imageName }}
      imageIdentifier: ${{ steps.config.outputs.imageIdentifier }}
      context: ${{ inputs.buildContext }}
      buildArgs: ${{ inputs.buildArgs }}
      tagNames: ${{ steps.metadata.outputs.tagNames }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: $/
      - id: config
        env:
          WORKFLOW_INPUTS: ${{ toJSON(inputs) }}
        run: bun "$WORKFLOWS_PATH/src/docker/build.ts"
      - id: metadata
        uses: $/actions/dockerMetadata
        with:
          options: ${{ inputs.releaseOptions }}
          imageName: ${{ steps.config.outputs.imageName }}
          id: ${{ steps.config.outputs.id }}
          flavorSuffix: ${{ inputs.flavorSuffix }}
      - if: steps.config.outputs.isNativeArch != 'true'
        uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - run: mkdir -p -- "$IMAGE_FOLDER"
        env:
          IMAGE_FOLDER: ${{ steps.config.outputs.imageFolder }}
      - id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ inputs.buildContext }}
          platforms: ${{ inputs.arch }}
          build-args: ${{ inputs.buildArgs }}
          outputs: type=docker,dest=${{ steps.config.outputs.imagePath }}
          cache-to: ${{ steps.config.outputs.cacheTo }}
          cache-from: ${{ steps.config.outputs.cacheFrom }}
          tags: ${{ steps.config.outputs.imageIdentifier }}
          labels: ${{ steps.metadata.outputs.labels }}
      - id: artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ steps.config.outputs.imageArtifact }}
          path: ${{ steps.config.outputs.imagePath }}
          if-no-files-found: error
          overwrite: ${{ inputs.imageArtifact != '' && github.run_attempt != '1' }}
          compression-level: 1
